<style>
:root{
  --navy:#1B2D4E; --navy-d:#101d35; --red:#DC2B3E; --bg:#F3F5F9; --card:#fff; --ink:#16223A; --muted:#5B6782; --line:#D8DEEA; --soft:#E9EDF5;
  --ok:#1E8A55; --okbg:#E3F4EA; --warn:#8A4B00; --warnbg:#FFF2DC; --bad:#A3172A; --badbg:#FBE5E8; --r:14px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1626; --card:#16213A; --ink:#E7ECF6; --muted:#9AA7C2; --line:#2A3858; --soft:#1D2A47; --okbg:#143326; --ok:#47C487; --warnbg:#3A2C10; --warn:#F0B44C; --badbg:#3E1820; --bad:#FF8A98; color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
/* top bar */
.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--red);position:sticky;top:0;z-index:20}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{background:var(--red);border-radius:7px;padding:3px 9px;font-weight:900;letter-spacing:.06em;font-size:.88rem}
.brand{font-weight:900;font-size:1.1rem}
.brand small{display:block;font-weight:400;font-size:.72rem;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.top select{background:var(--navy-d);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem;max-width:100%}
.top .ghost{background:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;color:#fff;font-weight:700;font-size:.9rem}
.clock{font-family:Menlo,Consolas,monospace;font-size:.85rem;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
main{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 2px 10px rgba(11,33,73,.06)}
h1{font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:900;line-height:1.15}
h2{font-size:1.25rem;font-weight:900}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.75rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:none;border-radius:10px;padding:11px 18px;background:var(--navy);color:#fff;font-weight:800;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.1)}
.btn.red{background:var(--red)}
.btn.ok{background:var(--ok)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.back{background:none;border:none;color:var(--muted);font-weight:800;padding:0;margin-bottom:12px}
/* hero + home */
.hero{background:linear-gradient(135deg,var(--navy) 60%,var(--red));color:#fff;border-radius:var(--r);padding:24px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
.hero p{opacity:.92;margin-top:8px;max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-width:280px}
@media(max-width:700px){.stats{min-width:0}}

.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}

.choice.here .ic{background:var(--red)}

.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}

/* topics */
.topics{display:grid;gap:10px;margin-top:14px}
.topic{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px}

select.big{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;width:100%;max-width:520px;font-weight:700}
/* task */
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:5px;flex-wrap:wrap}

.opt.right{border-color:var(--ok);background:var(--okbg)} .opt.wrong{border-color:var(--bad);background:var(--badbg)}

.verdict{border-radius:12px;padding:12px 14px;font-weight:700}
.verdict.ok{background:var(--okbg);color:var(--ok)} .verdict.bad{background:var(--badbg);color:var(--bad)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:520px){.rate{grid-template-columns:1fr}}
.rate button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-weight:800}
.rate button[aria-pressed=true]{border-color:var(--navy);background:var(--navy);color:#fff}
.rtl{direction:rtl;unicode-bidi:plaintext}
[dir=auto]{unicode-bidi:plaintext}
/* knowledge + modal */
.ideas{margin:10px 0 0 20px;display:grid;gap:6px}
.example{background:var(--soft);border-left:4px solid var(--red);border-radius:0 10px 10px 0;padding:12px 14px;white-space:pre-line;font-family:inherit;margin-top:12px}
.modal-bg{position:fixed;inset:0;background:rgba(8,15,30,.6);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--card);border-radius:var(--r);max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal h3{font-size:1.2rem;font-weight:900}
.modal{position:relative}
.xclose{position:sticky;top:0;float:right;margin:-8px -8px 6px 10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.15rem;font-weight:900;display:grid;place-items:center;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.xclose:hover{background:var(--soft)}
.lvl{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:900;letter-spacing:.03em;margin-left:6px;vertical-align:middle}
.lvl.l1{background:var(--okbg);color:var(--ok)} .lvl.l2{background:var(--warnbg);color:var(--warn)} .lvl.l3{background:var(--badbg);color:var(--bad)}
.dots i.c3{outline:2px solid var(--red);outline-offset:1px}
.agree{display:flex;gap:10px;align-items:flex-start;font-weight:700;cursor:pointer;margin-top:14px}
.agree input{width:20px;height:20px;accent-color:var(--red);flex:none;margin-top:2px}
/* summary */
.sumgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:700px){.sumgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum{background:var(--soft);border-radius:12px;padding:12px;text-align:center}
.sum b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.sum span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.list{margin:8px 0 0 18px;display:grid;gap:6px}
.fix{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.fix .q{font-size:1rem}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:70;font-weight:700;max-width:calc(100% - 32px)}
.pill.new{background:var(--red);color:#fff}
.lvl.rv{background:var(--soft);color:var(--ink);border:1px dashed var(--muted)}
.newsets{border-left:6px solid var(--red)}
.next-set{background:var(--soft);border-radius:12px;padding:12px 14px;border-left:4px solid var(--ok)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#sync{font-family:inherit;font-size:.8rem}
.hint{background:var(--warnbg);color:var(--ink);border-left:4px solid var(--warn);border-radius:0 10px 10px 0;padding:10px 14px;margin-top:8px}
.foot{text-align:center;color:var(--muted);font-size:.82rem;margin-top:30px}

<header class="top"><div class="in">
  <span class="logo">SISD</span><span class="brand">Study Plus<small id="whoLine"></small></span>
  <span class="sp"></span>
  <span class="clock hidden" id="sync" aria-live="polite"></span>
  <span class="clock hidden" id="clock" title="Active work time on this topic">⏱ 00:00</span>
  <select id="switcher" aria-label="Switch course"></select>
  <button class="ghost" id="outBtn">Sign out</button>
</div></header>

<div id="modalRoot"></div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id), esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = window.STUDY || {}, ORDER = ["maths","english","science","ins","islamic","french","arabic"].filter(k => S[k]);
const IDLE_MS = 60000, FOCUS_SEC_PER_TASK = 40, SET_SIZE = 8;
const GEN = window.STUDY_GEN || { make(){ return null; }, has(){ return false; } };

/* ---------- who is signed in: only the chosen student (and the test account) may stay ---------- */
const G = window.SDC ? SDC.gate() : null;
const WHO = G && (G.acct || G.who);
if (!window.SDC || !WHO || !SDC.studyPlusOK(WHO)){ try { sessionStorage.setItem("sdc_msg", JSON.stringify({ msg:"Choose your course to sign in.", kind:"warn" })); } catch(e){} location.replace(window.SDC ? SDC.PORTAL : "./"); return; }
const ACCT = Object.assign({ course:"study" }, G.acct || {}, { name: WHO.name || "", email: WHO.email || "" });
const FIRST = String(ACCT.name || "").split(/\s+/)[0] || "there";
$("whoLine").textContent = ACCT.name || ACCT.email;

/* ---------- a "session" = one sign-in. Coming back after signing out (or after 4 hours away) starts a new one,
   and every new session sets up the next challenge set for each finished topic. ---------- */
const SESS_KEY = "sdc_study_sess", SESS_GAP = 4 * 3600000;
const SESS = (() => { let o = null; try { o = JSON.parse(sessionStorage.getItem(SESS_KEY) || "null"); } catch(e){}
  if (!o || !o.id || Date.now() - (o.at || 0) > SESS_GAP) o = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), at: Date.now(), fresh: true };
  try { sessionStorage.setItem(SESS_KEY, JSON.stringify({ id:o.id, at:Date.now() })); } catch(e){} return o; })();
const touchSess = () => { try { sessionStorage.setItem(SESS_KEY, JSON.stringify({ id:SESS.id, at:Date.now() })); } catch(e){} };

/* ---------- saved progress: on this device, and a private locked copy online so it follows the student to any computer ---------- */
const KEY = "sdc_study_" + (SDC.keyOf ? SDC.keyOf(ACCT.email, ACCT.name) : (ACCT.email || ACCT.name)).replace(/[^\w:@.-]/g, "_");
let DB = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } })();
DB.topics = DB.topics || {}; DB.reports = DB.reports || [];
const SNAP = {};   // last saved copy of each topic, to know which topics changed (each topic carries its own "u" = last changed)
const isEmpty = o => !o.read && !o.ms && !Object.keys(o.ans || {}).length && !(o.rounds && o.rounds.length);
function topicJSON(o){ const u = o.u; delete o.u; const j = JSON.stringify(o); if (u != null) o.u = u; return j; }
function snapAll(){ Object.keys(DB.topics).forEach(k => SNAP[k] = topicJSON(DB.topics[k])); }
function stamp(){ const now = Date.now();
  Object.keys(DB.topics).forEach(k => { const o = DB.topics[k], j = topicJSON(o); if (SNAP[k] !== j){ if (!isEmpty(o)) o.u = now; SNAP[k] = j; } }); }
snapAll();
function save(){ try { stamp(); DB.updatedAt = Date.now(); touchSess(); localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} Cloud.later(); }
const tkey = (s, t) => s + "/" + t;
function tstate(s, t){ const k = tkey(s, t); return DB.topics[k] = DB.topics[k] || { i:0, ans:{}, ms:0, read:false, done:false, runs:0 }; }
function topicOf(s, t){ return (S[s].topics || []).find(x => x.id === t); }

/* ---------- the online copy: locked (AES-256) with a key made from the student's own Computer Science secret.
   Only a scrambled ID and locked text reach the sync sheet: no names, emails or answers can be read there. ---------- */
const Cloud = (() => {
  const TE = new TextEncoder(), C = { on:false, ids:[], pushedAt:0, first:0, timer:null, state:"local", busy:null };
  const hex = u8 => [...u8].map(v => v.toString(16).padStart(2, "0")).join("");
  const sha = async t => new Uint8Array(await crypto.subtle.digest("SHA-256", TE.encode(t)));
  const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const pipe = async (u8, st) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(st)).arrayBuffer());
  const canZip = typeof CompressionStream === "function" && typeof DecompressionStream === "function";
  async function secrets(){
    const L = (G && G.link) || {}, out = [];
    const em = String((L.design && L.design.email) || (SDC.studyPlusEmail ? SDC.studyPlusEmail(ACCT) : "") || ACCT.email || "").toLowerCase();
    const dk = (L.cs && L.cs.dk) || (G && G.acct && G.acct.dk) || "";
    if (dk && em) out.push("cs" + hex(await sha("sdc-cs-design|" + em + "|" + dk)).slice(0, 40));   // the same secret Design uses for this student
    if (L.design && L.design.pw) out.push(String(L.design.pw));
    return out.filter((v, i) => out.indexOf(v) === i);
  }
  async function idFor(sec){ const raw = await sha("sdc-study-key|" + sec);
    return { id: hex(await sha("sdc-study-id|" + sec)).slice(0, 32), key: await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]) }; }
  async function seal(k, text){ let body = TE.encode(text), flag = 0; if (canZip){ body = await pipe(body, new CompressionStream("gzip")); flag = 1; }
    const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, k, body));
    const out = new Uint8Array(13 + ct.length); out[0] = flag; out.set(iv, 1); out.set(ct, 13); return b64(out); }
  async function open(k, s){ const u = unb64(s), iv = u.slice(1, 13); let body = new Uint8Array(await crypto.subtle.decrypt({ name:"AES-GCM", iv }, k, u.slice(13)));
    if (u[0] === 1) body = await pipe(body, new DecompressionStream("gzip")); return JSON.parse(new TextDecoder().decode(body)); }
  function show(state){ C.state = state; const el = $("sync"); if (!el) return;
    const T = { local:["💾 Saved on this computer", "Your progress is saved on this computer. Sign in through Computer Science to save it online too."],
      loading:["☁ Loading your progress…", "Getting your saved progress"], saving:["☁ Saving…", "Saving your progress online"],
      saved:["☁ Saved", "Your progress is saved online: sign in on any computer to carry on"], offline:["☁ Will save when online", "No connection: your work is kept here and saved online as soon as you're back online"] }[state] || ["", ""];
    el.textContent = T[0]; el.title = T[1]; el.classList.remove("hidden"); }
  async function init(){ if (!(window.crypto && crypto.subtle) || !SDC.sendRow || !SDC.rows) { show("local"); return false; }
    try { const L = await secrets(); for (const s of L) C.ids.push(await idFor(s)); } catch(e){}
    C.on = C.ids.length > 0; show(C.on ? "loading" : "local"); return C.on; }
  /* newest complete copy under each ID (big copies are split into parts) */
  async function pull(){ const got = [];
    for (const c of C.ids){ let rows = []; try { rows = await SDC.rows("Y", c.id, 40); } catch(e){ continue; }
      const sets = {}; rows.forEach(r => { const p = String(r.text).split("."); if (p.length !== 5 || p[0] !== "s1") return; const v = p[1], g = sets[v] = sets[v] || { n:+p[3], parts:{} }; g.parts[+p[2]] = p[4]; });
      const vers = Object.keys(sets).sort((a, b) => +b - +a);
      for (const v of vers){ const g = sets[v]; if (Object.keys(g.parts).length !== g.n) continue;

/* ---------- sets: Set 1 is the topic's own tasks. Sets 2, 3, 4 … are built automatically from the question bank

const TC = {};   // built tasks for each set (not saved: rebuilt from the set's recipe)
function runsOf(s, t){ const st = tstate(s, t); return 1 + ((st.rounds && st.rounds.length) || 0); }
function run(s, t, r){
  const st = tstate(s, t), T = topicOf(s, t); r = r || runsOf(s, t);
  if (r <= 1 || !st.rounds || !st.rounds[r - 2]) return { r:1, o:st, tasks:T.tasks, refs:T.tasks.map((_, i) => ({ s:"b", i })) };
  const o = st.rounds[r - 2], ck = s + "/" + t + "/" + r + "/" + o.seed;

/* how many Core / Extended / Challenge questions for a target level between 1 and 3 */
const MIX = { "1":[5,3,0], "1.25":[4,3,1], "1.5":[3,4,1], "1.75":[2,4,2], "2":[2,3,3], "2.25":[1,3,4], "2.5":[1,2,5], "2.75":[0,3,5], "3":[0,2,6] };

const LVL_NAME = lv => lv < 1.5 ? "Core" : lv < 2.25 ? "Extended" : "Challenge";
function buildRound(s, t){
  const st = tstate(s, t), T = topicOf(s, t), pool = T.pool || [], gk = s + "/" + t, hasGen = GEN.has(gk);
  st.rounds = st.rounds || [];
  const last = run(s, t), sc = runScore(s, t, last.r).score, A = analysis(s, t, last.r);
  const step = sc >= 85 ? .5 : sc >= 65 ? .25 : sc >= 50 ? 0 : -.5;
  const lv = Math.max(1, Math.min(3, (st.lv != null ? st.lv : 1.5) + step)); st.lv = lv;
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, R = rnd(seed), shuffle = L => { const a = L.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  A.gaps.slice(0, 2).forEach(i => { const ref = last.refs[i], b = last.tasks[i]; if (!ref || !b) return;
    if (ref.s === "g") refs.push({ s:"g", d: ref.d || b.d || 1, g:(seed + i * 7919) >>> 0, rv:1 });
    else { const base = ((ref.s === "p" ? pool : T.tasks) || [])[ref.i] || b;
      if (base.k === "mcq" && base.o) refs.push({ s:ref.s, i:ref.i, v: R() < .5 ? 1 : 2, j: Math.floor(R() * base.o.length), rv:1 });
      else if (hasGen && (base.k === "num" || base.k === "text")) refs.push({ s:"g", d: base.d || 1, g:(seed + i * 7919) >>> 0, rv:1 });   // same skill, fresh numbers

  const need = mixFor(lv, SET_SIZE - refs.length), lvOf = x => x.d || 1, taken = new Set();

    const fromPool = hasGen ? Math.min(fresh.length, Math.ceil(n / 2)) : Math.min(fresh.length, n);
    fresh.slice(0, fromPool).forEach(i => { taken.add(i); refs.push({ s:"p", i }); }); n -= fromPool;
    if (n && hasGen) for (let k = 0; k < n; k++) refs.push({ s:"g", d, g:(seed + (d * 101 + k) * 2654435761) >>> 0 });

      const near = shuffle(pool.map((x, i) => i).filter(i => !usedP.has(i) && !taken.has(i) && Math.abs(lvOf(pool[i]) - d) === 1));
      near.slice(0, n).forEach(i => { taken.add(i); refs.push({ s:"p", i }); }); n -= Math.min(n, near.length);
      if (n){ const old = shuffle(pool.map((x, i) => ({ s:"p", i, x })).concat(T.tasks.map((x, i) => ({ s:"b", i, x }))).filter(c => lvOf(c.x) === d || n > 0))
          .filter(c => !refs.some(r => r.s === c.s && r.i === c.i))
          .sort((a, b) => ((lastOk[a.s + a.i] ? 1 : 0) - (lastOk[b.s + b.i] ? 1 : 0)) || (Math.abs(lvOf(a.x) - d) - Math.abs(lvOf(b.x) - d)) || ((lastSeen[a.s + a.i] || 0) - (lastSeen[b.s + b.i] || 0)));

}
/* every time the student comes back: each finished topic gets its next set, ready and waiting */
function ensureRounds(){
  const made = [];

    const X = run(s, T.id); if (!X.o.done || X.o.doneSess === SESS.id) return;

/* ---------- marking ---------- */
const strip = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
const clean = s => String(s || "").toLowerCase().replace(/[’`]/g, "'").replace(/[−–]/g, "-").replace(/\s+/g, " ").trim().replace(/[.!]$/, "").replace(/\s*([(),])\s*/g, "$1");

function mark(task, given){
  if (task.k === "mcq") return { ok: given === task.a };
  if (task.k === "tf") return { ok: given === task.a };
  if (task.k === "num"){ const n = toNum(given); return { ok: !isNaN(n) && Math.abs(n - task.a) <= (task.tol || 1e-9), blank: String(given || "").trim() === "", bad: isNaN(n) }; }
  if (task.k === "text"){
    let g = clean(given); const pre = clean(task.prefix || ""); if (pre && g.startsWith(pre)) g = g.slice(pre.length).trim();
    g = g.replace(/\s*\/\s*/g, "/");
    const acc = task.a.map(clean);
    if (acc.indexOf(g) >= 0) return { ok:true };
    if (acc.map(strip).indexOf(strip(g)) >= 0) return { ok:true, accent:true };

function rightText(task){
  if (task.k === "mcq") return task.o[task.a];
  if (task.k === "tf") return task.a ? "True" : "False";
  if (task.k === "num") return String(task.a);
  if (task.k === "text") return (task.prefix || "") + (task.best || task.a[0]);
  return "";
}
function givenText(task, g){
  if (task.k === "mcq") return g == null ? "" : task.o[g];
  if (task.k === "tf") return g == null ? "" : g ? "True" : "False";
  return String(g == null ? "" : g);

/* ---------- scores (per set) ---------- */
function runScore(s, t, r){
  const X = run(s, t, r), o = X.o, n = X.tasks.length;

  X.tasks.forEach((_, i) => { const a = o.ans[i]; if (!a) return; answered++; if (a.ok) right++; if (a.rate === 3) need++; if (a.rate === 2) unsure++; if (a.rate === 1) got++; });
  const score = n ? Math.round(right / n * 100) : 0, completion = n ? answered / n : 0, ms = o.ms || 0;
  const focus = Math.min(1, (ms / 1000) / (Math.max(1, answered) * FOCUS_SEC_PER_TASK));
  const effort = Math.round(100 * (0.6 * (score / 100) + 0.2 * completion + 0.2 * focus));
  const lv = {}; X.tasks.forEach((tk, i) => { const d = lvlOf(tk), q = lv[d] = lv[d] || { n:0, right:0 }; q.n++; if (o.ans[i] && o.ans[i].ok) q.right++; });
  return { n, right, answered, score, effort, focus: Math.round(focus * 100), need, unsure, got, ms, lv, r: X.r };
}

function topicMs(s, t){ const st = tstate(s, t); return (st.ms || 0) + (st.rounds || []).reduce((a, o) => a + (o.ms || 0), 0); }

    ms += topicMs(s, t); if (st.done) done++;
    for (let r = 1; r <= runsOf(s, t); r++){ const X = run(s, t, r); if (X.o.done){ sets++; sc += runScore(s, t, r).score; n++; } }
    const X = run(s, t); if (X.r > 1 && !X.o.done && !Object.keys(X.o.ans).length) waiting.push({ s, t, r:X.r }); });
  return { ms, done, sets, avg: n ? Math.round(sc / n) : 0, waiting };
}

  $("xOk").onclick = () => { hush(); closeModal(); };
}

/* ---------- finishing: summary, log for the super admin, email to the teacher ---------- */
function finishTopic(s, t, r){
  const st = tstate(s, t), X = run(s, t, r), o = X.o, n = Object.keys(o.ans).length, first = !o.done || (o.reportedN || 0) < n;
  o.done = true; o.doneSess = SESS.id; o.finishedAt = Date.now(); o.reportedN = n;
  if (X.r === 1){ st.runs = (st.runs || 0) + 1; }
  save();
  if (first) report(s, t, false, X.r);
  Cloud.push();
  go({ v:"summary", s, t, r:X.r });
}
function finishRetry(s, t, r){ const o = run(s, t, r).o; o.retriedAt = Date.now(); save(); report(s, t, true, r); Cloud.push(); go({ v:"summary", s, t, r }); }
function analysis(s, t, r){
  const X = run(s, t, r), o = X.o, well = [], improve = [], gaps = [];
  X.tasks.forEach((task, i) => { const a = o.ans[i]; if (!a) return; const fixed = o.retry && o.retry[i] && o.retry[i].ok;
    if (a.ok && a.rate === 1) well.push(task.q);
    else if (!a.ok){ improve.push({ q: task.q, right: rightText(task), given: givenText(task, a.g), fixed }); gaps.push(i); }
    else if (a.rate >= 2){ improve.push({ q: task.q, right: rightText(task), given: givenText(task, a.g), unsure: true }); gaps.push(i); } });
  return { well, improve, gaps };
}
function report(s, t, isRetry, r){
  const T = topicOf(s, t), X = run(s, t, r), sc = runScore(s, t, X.r), A = analysis(s, t, X.r), o = X.o;
  const fixedNow = isRetry ? Object.values(o.retry || {}).filter(q => q.ok).length : 0;
  const data = { subject: S[s].name, sid: s, topic: T.title + (X.r > 1 ? " · Set " + X.r + " (" + LVL_NAME(o.lv) + ")" : ""), tid: t, round: X.r, level: X.r > 1 ? LVL_NAME(o.lv) : "", strand: T.strand, score: sc.score, right: sc.right, n: sc.n, lv: sc.lv, effort: sc.effort, focus: sc.focus,
    mins: Math.max(1, mins(sc.ms)), secs: Math.round(sc.ms / 1000), got: sc.got, unsure: sc.unsure, need: sc.need, retry: !!isRetry, fixed: fixedNow,
    well: A.well.slice(0, 6).map(q => q.slice(0, 120)), improve: A.improve.slice(0, 8).map(x => ({ q: x.q.slice(0, 120), right: String(x.right).slice(0, 80), given: String(x.given).slice(0, 80), unsure: !!x.unsure, fixed: !!x.fixed })),
    hints: Object.values(o.hn || {}).reduce((a, b) => a + b, 0), solutions: Object.values(o.ans || {}).filter(q => q.sol).length,
    totalMs: totals().ms };
  DB.reports.push(Object.assign({ at: Date.now() }, data)); if (DB.reports.length > 300) DB.reports.shift(); save();
  try { SDC.log("studyplus", ACCT, { study: data }); } catch(e){}
  try { SDC.studyReport(ACCT, data); } catch(e){}
}
function renderSummary(){
  const s = VIEW.s, t = VIEW.t, SUB = S[s], T = topicOf(s, t), X = run(s, t, VIEW.r), r = X.r, o = X.o, tasks = X.tasks, sc = runScore(s, t, r), A = analysis(s, t, r);
  const latest = r === runsOf(s, t);
  const msg = sc.score >= 85 ? "Excellent work: you really know this topic." : sc.score >= 65 ? "Good work. Fix the few gaps below to master it." : sc.score >= 40 ? "A solid start. Use the corrections below, then try the mistakes again." : "This topic needs more practice. Re-read the key knowledge, then fix your mistakes.";
  const gapsLeft = A.gaps.filter(i => !(o.retry && o.retry[i] && o.retry[i].ok));
  $("app").innerHTML = `<button class="back" id="bk">← ${esc(SUB.name)}</button>
  <div class="card stack" style="border-top:6px solid ${SUB.colour}">
    <div><div class="eyebrow">${esc(SUB.name)} · ${r > 1 ? "Set " + r + " complete · " + esc(LVL_NAME(o.lv)) + " level" : "Topic complete"}</div><h1>${esc(T.title)}</h1><p class="muted" style="margin-top:4px">${msg}</p></div>
    <div class="sumgrid"><div class="sum"><b>${sc.score}%</b><span>Score</span></div><div class="sum"><b>${sc.right}/${sc.n}</b><span>Right first time</span></div><div class="sum"><b>${fmt(sc.ms)}</b><span>Active work time</span></div><div class="sum"><b>${sc.effort}%</b><span>Effort</span></div></div>
    <div class="row small">${[1,2,3].filter(d => sc.lv[d]).map(d => `<span class="lvl l${d}" style="margin:0">${"●".repeat(d)} ${LVL[d]}: ${sc.lv[d].right}/${sc.lv[d].n}</span>`).join("")}</div>
    ${latest ? `<div class="next-set"><b>✦ What's next</b><br><span class="small">Next time you sign in, a new set of questions on this topic will be waiting${sc.score >= 85 ? ", one step more challenging" : sc.score >= 65 ? ", a little more challenging" : sc.score >= 50 ? ", at the same level" : ", focused on the key ideas"}. Want it now? Tap <b>New challenge set</b>.</span></div>` : ""}
    <div class="two">
      <div class="card" style="box-shadow:none"><h2>⭐ What you did well</h2>${A.well.length ? `<ul class="list">${A.well.map(q => `<li dir="auto">${esc(q)}</li>`).join("")}</ul>` : `<p class="muted small" style="margin-top:6px">Answer confidently and correctly to see your strengths here.</p>`}</div>
      <div class="card" style="box-shadow:none"><h2>🎯 What to improve</h2>${A.improve.length ? `<ul class="list">${A.improve.map(x => `<li dir="auto">${esc(x.q)}${x.fixed ? ` <span class="pill ok">fixed</span>` : x.unsure ? ` <span class="pill warn">not sure yet</span>` : ""}</li>`).join("")}</ul>` : `<p class="muted small" style="margin-top:6px">No gaps found in this set. 🎉</p>`}</div>
    </div>
    ${A.improve.length ? `<div><h2>📝 Corrections</h2><p class="muted small" style="margin-top:2px">Read each correction carefully; these are your knowledge gaps.</p><div class="stack" style="margin-top:10px">${A.gaps.map(i => { const task = tasks[i], a = o.ans[i];
      return `<div class="fix"><div class="q" dir="auto">${esc(task.q)}</div>${a.ok ? "" : `<div><span class="pill bad">You said</span> <span dir="auto">${esc(givenText(task, a.g))}</span></div>`}<div><span class="pill ok">Answer</span> <span dir="auto">${esc(rightText(task))}</span></div><div class="example" dir="auto" style="margin-top:4px">${esc(task.x)}</div></div>`; }).join("")}</div></div>` : ""}
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" id="kAgain">📘 Key knowledge</button>
      ${runsOf(s, t) > 1 ? `<button class="btn ghost" id="mySets">📚 My sets (${runsOf(s, t)})</button>` : ""}
      ${gapsLeft.length ? `<button class="btn red" id="fixBtn">Fix my mistakes (${gapsLeft.length})</button>` : ""}
      ${r === 1 && runsOf(s, t) === 1 ? `<button class="btn ghost" id="redo">Start this topic again</button>` : ""}
      ${latest ? `<button class="btn ok" id="newSet">✦ New challenge set</button>` : `<button class="btn ok" id="toLatest">Go to my latest set →</button>`}
      <button class="btn" id="nextT">${nextTopic(s, t) ? "Next topic →" : "Back to " + esc(SUB.name)}</button>
    </div>
    <p class="muted small">Effort combines your score (60%), how many tasks you finished (20%) and how much real work time you spent on them (20%).</p>
  </div>`;
  $("bk").onclick = () => go({ v:"subject", s });
  $("kAgain").onclick = () => showKnowledge(s, t, false);
  if ($("mySets")) $("mySets").onclick = () => go({ v:"sets", s, t });
  if ($("fixBtn")) $("fixBtn").onclick = () => { const o2 = run(s, t, r).o; o2.retry = {}; save(); go({ v:"topic", s, t, r, retry: gapsLeft, pos: 0 }); };
  if ($("redo")) $("redo").onclick = () => { if (!confirm("Start this topic again? Your previous result has already been sent to your teacher.")) return; const st2 = tstate(s, t); st2.ans = {}; st2.retry = {}; st2.i = 0; st2.done = false; save(); go({ v:"topic", s, t, r:1 }); };
  if ($("newSet")) $("newSet").onclick = () => { buildRound(s, t); save(); Cloud.push(); openTopic(s, t); };
  if ($("toLatest")) $("toLatest").onclick = () => openTopic(s, t);
  $("nextT").onclick = () => { const n = nextTopic(s, t); if (n) openTopic(s, n); else go({ v:"subject", s }); };
}
function nextTopic(s, t){ const L = S[s].topics, i = L.findIndex(x => x.id === t); for (let j = i + 1; j < L.length; j++) if (!tstate(s, L[j].id).done) return L[j].id; return null; }

/* ---------- all sets for a topic, and a read-only review of any set ---------- */
function renderSets(){
  const s = VIEW.s, t = VIEW.t, SUB = S[s], T = topicOf(s, t), n = runsOf(s, t);
  const rows = Array.from({ length:n }, (_, k) => n - k).map(r => { const X = run(s, t, r), sc = runScore(s, t, r), o = X.o, started = Object.keys(o.ans).length;
    const when = o.finishedAt || o.at, d = when ? new Date(when).toLocaleDateString("en-GB", { day:"numeric", month:"short" }) : "";
    const state = o.done ? `<span class="pill ${sc.score >= 70 ? "ok" : sc.score >= 50 ? "warn" : "bad"}">${sc.score}%</span>` : started ? `<span class="pill warn">${sc.answered}/${sc.n} done</span>` : `<span class="pill new">✦ Ready</span>`;
    return `<div class="setrow"><div><b>Set ${r}</b> <span class="muted small">· ${r === 1 ? "Starter set" : esc(LVL_NAME(o.lv)) + " level"}${d ? " · " + d : ""} · ${X.tasks.length} questions${o.ms ? " · " + fmt(o.ms) : ""}</span></div>
      <div class="row">${state}${started ? `<button class="btn sm ghost" data-rv="${r}">Review</button>` : ""}${!o.done ? `<button class="btn sm" data-go="${r}">${started ? "Continue" : "Start"} →</button>` : ""}</div></div>`; }).join("");
  $("app").innerHTML = `<button class="back" id="bk">← ${esc(SUB.name)}</button>
  <div class="card stack" style="border-top:6px solid ${SUB.colour}">
    <div><div class="eyebrow">${esc(SUB.name)} · My sets</div><h1>${esc(T.title)}</h1><p class="muted" style="margin-top:4px">Every set you've worked on is saved. Review any of them to see your answers, the right answers and the explanations.</p></div>
    <div class="stack" style="gap:8px">${rows}</div>
  </div>`;
  $("bk").onclick = () => go({ v:"subject", s });
  $("app").querySelectorAll("[data-rv]").forEach(b => b.onclick = () => go({ v:"review", s, t, r:+b.dataset.rv }));
  $("app").querySelectorAll("[data-go]").forEach(b => b.onclick = () => openTopic(s, t));
}
function renderReview(){
  const s = VIEW.s, t = VIEW.t, SUB = S[s], T = topicOf(s, t), X = run(s, t, VIEW.r), o = X.o, sc = runScore(s, t, X.r);
  $("app").innerHTML = `<button class="back" id="bk">← My sets</button>
  <div class="card stack" style="border-top:6px solid ${SUB.colour}">
    <div><div class="eyebrow">${esc(SUB.name)} · Review · Set ${X.r}${X.r > 1 ? " · " + esc(LVL_NAME(o.lv)) + " level" : ""}</div><h1>${esc(T.title)}</h1>
      <p class="muted" style="margin-top:4px">${o.done ? `Score ${sc.score}% · ${sc.right}/${sc.n} right first time` : `${sc.answered} of ${sc.n} answered so far`}</p></div>
    <div class="stack">${X.tasks.map((task, i) => { const a = o.ans[i], f = o.retry && o.retry[i];
      return `<div class="fix"><div class="q" dir="auto">${i + 1}. ${lvlTag(task)} ${esc(task.q)}</div>
        ${a ? `<div><span class="pill ${a.ok ? "ok" : "bad"}">${a.ok ? "✓ You said" : "✗ You said"}</span> <span dir="auto">${esc(givenText(task, a.g))}</span>${a.rate ? ` <span class="muted small">· ${["", "😀 got it", "🤔 partly", "😟 need help"][a.rate]}</span>` : ""}${f ? ` <span class="pill ${f.ok ? "ok" : "warn"}">${f.ok ? "fixed" : "tried again"}</span>` : ""}</div>` : `<div class="muted small">Not answered yet</div>`}
        ${a ? `<div><span class="pill ok">Answer</span> <span dir="auto">${esc(rightText(task))}</span></div><div class="example" dir="auto" style="margin-top:4px">${esc(task.x)}</div>` : ""}</div>`; }).join("")}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="kAgain">📘 Key knowledge</button><button class="btn" id="bk2">← My sets</button></div>
  </div>`;
  $("bk").onclick = $("bk2").onclick = () => go({ v:"sets", s, t });
  $("kAgain").onclick = () => showKnowledge(s, t, false);
}

/* ---------- small UI helpers ---------- */
function modal(html){
  $("modalRoot").innerHTML = `<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal"><button class="xclose" id="mClose" aria-label="Close" title="Close">✕</button>${html}</div></div>`;
  $("mClose").onclick = closeModal;
  $("modalRoot").querySelector(".modal-bg").addEventListener("click", e => { if (e.target.classList.contains("modal-bg")) closeModal(); });
}
function closeModal(){ hush(); $("modalRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("modalRoot").innerHTML) closeModal(); });
function toast(m){ const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }

/* ---------- start: show this computer's copy straight away, then bring in the online copy and set up new sets ---------- */
paintSwitcher();
try { SDC.log("studyopen", ACCT, {}); } catch(e){}
render();
let READY = false;
(async function boot(){
  let pulled = 0;
  try { if (await Cloud.init()){ const got = await Promise.race([Cloud.pull(), new Promise(r => setTimeout(() => r(null), 12000))]);
      if (got) got.forEach(R => pulled += mergeIn(R)); else Cloud.show("offline"); } } catch(e){}
  const made = ensureRounds();
  if (pulled || made.length) save();
  READY = true;
  if (VIEW.v === "home" || VIEW.v === "subject" || (pulled && VIEW.v !== "topic")) render();
  if (made.length) toast(`✦ ${made.length} new challenge set${made.length > 1 ? "s are" : " is"} ready for you`);
  else if (pulled) toast("Your saved progress has been loaded");
  if (Cloud.on) Cloud.push();
})();
window.__study = { hintsFor, mark, topicScore, runScore, run, buildRound, ensureRounds, mergeIn, DB: () => DB, SESS, ready: () => READY, Cloud };   // used by the self-test
})();
</script>
