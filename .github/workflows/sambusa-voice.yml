name: Sambusa voice
# Puts real human recordings (Wikimedia Commons, free licences) into the Sambusa baby videos and picture cards, then commits them.
# Only writes inside uk/baby. Runs when the voice script changes, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['tools/sambusa-voice/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: sambusa-voice
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install soundfile numpy
      - run: python tools/sambusa-voice/human.py
      - run: |
          git config user.name "sambusa-voice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A uk/baby tools/sambusa-voice/report.txt
          git commit -m "Sambusa: real human voice recordings added to the videos and picture cards" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
